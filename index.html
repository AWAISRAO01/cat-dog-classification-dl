<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat vs Dog Classifier</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 32px;
      border-radius: 22px;
      box-shadow: 0 15px 45px #00000012;
      text-align: center;
    }

    h1 { color: #4338ca; }
    p { color: #6b7280; line-height: 1.6; }

    .upload {
      display: block;
      border: 2px dashed #a5b4fc;
      border-radius: 16px;
      padding: 28px 16px;
      margin: 24px 0;
      cursor: pointer;
      background: #f8faff;
    }

    input { max-width: 100%; margin-top: 14px; }

    img {
      display: none;
      max-width: 100%;
      max-height: 320px;
      margin: 20px auto;
      border-radius: 14px;
      object-fit: contain;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 24px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      background: #f3f4f6;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .links { margin-top: 24px; font-size: 14px; }
    a { color: #4338ca; font-weight: bold; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>
</head>

<body>
  <main class="card">
    <h1>🐱 Cat vs Dog Classifier 🐶</h1>

    <p>
      Upload an image and let the trained deep learning model
      predict whether it is a cat or a dog.
    </p>

    <label class="upload">
      <strong>Select an image</strong>
      <br>
      <input id="imageInput" type="file" accept="image/*">
    </label>

    <img id="preview" alt="Selected image preview">

    <button id="predictBtn" disabled>Predict Image</button>

    <div id="result" role="status" aria-live="polite">
      Choose an image to get started.
    </div>

    <div class="links">
      <p>
        Project Source Code: 
        <a href="https://github.com/AWAISRAO01/cat-dog-classification-dl" target="_blank" rel="noopener">GitHub Repository</a>
      </p>
      <p>
        Trained Model Weights: 
        <a href="https://huggingface.co/awaisrao/cat-dog-classification-dl" target="_blank" rel="noopener">Hugging Face Model</a>
      </p>
    </div>
  </main>

  <script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const button = document.getElementById("predictBtn");
    const result = document.getElementById("result");

    const modelUrl = "https://raw.githubusercontent.com/AWAISRAO01/cat-dog-classification-dl/main/cat_dog_model.tflite";
    
    // Set explicit WASM path to prevent '_malloc' error
    tflite.setWasmPath("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/");

    let model = null;
    let selectedFile = null;
    let isBusy = false;

    input.addEventListener("change", () => {
      const file = input.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        selectedFile = null;
        button.disabled = true;
        result.textContent = "Please select a valid image.";
        return;
      }

      selectedFile = file;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      button.disabled = isBusy;
      result.textContent = "Image selected. Ready to predict.";
    });

    async function loadModel() {
      if (model) return model;

      result.textContent = "Loading trained model... Please wait.";

      await tf.ready();

      model = await tflite.loadTFLiteModel(modelUrl);

      return model;
    }

    button.addEventListener("click", async () => {
      if (!selectedFile || isBusy) return;

      isBusy = true;
      button.disabled = true;

      let inputTensor = null;
      let outputTensor = null;

      try {
        const activeModel = await loadModel();

        result.textContent = "Analyzing image...";

        await preview.decode();

        inputTensor = tf.tidy(() => {
          const pixels = tf.browser.fromPixels(preview);
          const resized = tf.image.resizeBilinear(pixels, [160, 160]);
          return resized.toFloat().div(255).expandDims(0);
        });

        outputTensor = activeModel.predict(inputTensor);

        const values = await outputTensor.data();
        const score = Number(values[0]);

        if (!Number.isFinite(score)) {
          throw new Error("Model returned an invalid prediction.");
        }

        const isDog = score >= 0.5;
        const confidence = isDog ? score : 1 - score;
        const label = isDog ? "Dog 🐶" : "Cat 🐱";

        result.textContent =
          `Prediction: ${label} | Model score: ${score.toFixed(3)} | ` +
          `Confidence: ${(confidence * 100).toFixed(1)}%`;

      } catch (error) {
        console.error("Prediction error:", error);
        model = null;

        result.textContent =
          "Prediction failed. Please check connection or model path. Details: " +
          (error.message || "Unknown error");
      } finally {
        if (inputTensor) inputTensor.dispose();
        if (outputTensor) outputTensor.dispose();

        isBusy = false;
        button.disabled = !selectedFile;
      }
    });
  </script>
</body>
</html>
